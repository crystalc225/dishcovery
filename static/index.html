<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dishcovery · decode every menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* ---- editorial food journal: warm paper, ink, tomato-red stamps ---- */
  :root {
    --paper: #FAF4EA;
    --ink: #23190F;
    --dim: #8B7B64;
    --red: #D6402B;
    --gold: #BC8420;
    --green: #47825F;
    --card: #FFFFFF;
    --edge: #EADDC8;
    --serif: "Noto Serif TC", "Fraunces", Georgia, serif;
    --display: "Fraunces", "Noto Serif TC", Georgia, serif;
    --sans: -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--paper); scroll-behavior: smooth; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); min-height: 100dvh; }

  header {
    padding: 18px 20px 0; display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .seal {
    width: 36px; height: 36px; border: 2.5px solid var(--red); border-radius: 9px;
    color: var(--red); font-family: var(--serif); font-weight: 700; font-size: 18px;
    display: grid; place-items: center; transform: rotate(-5deg); background: var(--card);
  }
  header h1 { font-family: var(--display); font-weight: 700; font-size: 21px; }
  header select {
    font: inherit; font-size: 14px; color: var(--ink);
    border: 1.5px solid var(--edge); border-radius: 10px; padding: 6px 10px; background: var(--card);
  }

  /* ---- tabs ---- */
  nav { display: flex; gap: 8px; padding: 16px 20px 0; max-width: 640px; margin: 0 auto; }
  .tab {
    font: inherit; font-size: 14.5px; font-weight: 600; padding: 9px 20px;
    border-radius: 999px; border: 1.5px solid var(--edge); background: transparent; color: var(--dim);
    transition: all .18s ease;
  }
  .tab.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  main { padding: 20px; padding-bottom: 56px; max-width: 640px; margin: 0 auto; }
  .view { display: none; } .view.on { display: block; }

  /* ---- capture ---- */
  .capture { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 52px 24px; text-align: center; }
  .capture .dots { color: var(--red); letter-spacing: .4em; font-size: 14px; }
  .capture h2 { font-family: var(--display); font-weight: 500; font-size: 30px; line-height: 1.25; max-width: 16ch; }
  .capture h2 em { font-style: italic; color: var(--red); }
  .capture p { color: var(--dim); font-size: 15px; max-width: 32ch; line-height: 1.55; }
  .btn {
    font: inherit; font-size: 16px; font-weight: 700; color: #fff;
    background: var(--red); border: 0; border-radius: 999px; padding: 15px 30px;
    box-shadow: 0 8px 24px rgba(214,64,43,.28);
    transition: transform .12s ease;
  }
  .btn:active { transform: scale(.96); }
  .btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--edge); box-shadow: none; font-weight: 600; }
  #file { display: none; }

  /* ---- loading ---- */
  .loading { display: none; padding: 36px 0; }
  .loading.on { display: block; }
  .skeleton { height: 96px; border-radius: 18px; margin-bottom: 12px;
    background: linear-gradient(100deg, #F1E8D8 40%, #FBF6ED 50%, #F1E8D8 60%);
    background-size: 200% 100%; animation: shimmer 1.3s infinite linear; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .loading .hint { text-align: center; color: var(--dim); font-size: 14px; }

  /* ---- cards ---- */
  .lang-tag { display: none; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); margin-bottom: 16px; }
  .lang-tag .pill { color: var(--red); border: 1.5px solid var(--red); border-radius: 999px; padding: 2px 11px; font-weight: 600; }

  .card {
    position: relative; border: 1.5px solid var(--edge); border-radius: 18px; background: var(--card);
    padding: 18px 20px; margin-bottom: 12px; cursor: pointer;
    box-shadow: 0 2px 10px rgba(35,25,15,.04);
    opacity: 0; transform: translateY(18px);
    transition: opacity .5s cubic-bezier(.2,.7,.3,1), transform .5s cubic-bezier(.2,.7,.3,1), border-color .15s;
  }
  .card.in { opacity: 1; transform: none; }
  .card:active { border-color: var(--red); }
  .idx { color: var(--red); font-size: 13px; font-weight: 800; vertical-align: 2px; margin-right: 2px; }
  .card .tname { font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.3; padding-right: 74px; }
  .card .orig { font-family: var(--serif); font-size: 15px; color: var(--dim); margin-top: 3px; }
  .card .lit { font-size: 13px; color: var(--red); font-style: italic; margin-top: 4px; }
  .card .what { font-size: 14px; color: var(--dim); margin-top: 8px; line-height: 1.5; }
  .stamp {
    position: absolute; top: 15px; right: 15px;
    font-size: 10.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    color: var(--red); border: 2px solid var(--red); border-radius: 7px;
    padding: 3px 9px; transform: rotate(4deg); background: rgba(214,64,43,.05);
  }
  .stamp.unsure { color: var(--gold); border-color: var(--gold); background: rgba(188,132,32,.06); }

  .error { display: none; background: #FBEAE6; border: 1.5px solid #EFC4BB; color: #A5301D;
    border-radius: 14px; padding: 13px 15px; font-size: 14px; margin-bottom: 16px; }
  .error.on { display: block; }
  .again { display: none; width: 100%; margin-top: 16px; }
  .again.on { display: block; }

  /* ---- bottom sheet ---- */
  .scrim { position: fixed; inset: 0; background: rgba(35,25,15,.45); backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 40; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--paper); z-index: 50;
    max-width: 680px; margin: 0 auto;
    box-shadow: 0 -8px 40px rgba(35,25,15,.12);
    border-radius: 24px 24px 0 0; padding: 10px 20px calc(28px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .4s cubic-bezier(.2,.9,.25,1);
    max-height: 90dvh; overflow-y: auto;
  }
  .open .scrim { opacity: 1; pointer-events: auto; }
  .open .sheet { transform: none; }
  .grabber { width: 42px; height: 4.5px; border-radius: 3px; background: var(--edge); margin: 6px auto 16px; }

  /* photo carousel */
  .carousel { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory;
    margin: 0 -20px 16px; padding: 0 20px; -webkit-overflow-scrolling: touch; }
  .carousel::-webkit-scrollbar { display: none; }
  .shot { flex: 0 0 82%; aspect-ratio: 4 / 3; scroll-snap-align: center; border-radius: 18px;
    overflow: hidden; position: relative; background: linear-gradient(135deg, #F0E6D4, #E7DBC5); }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shot .fallback { position: absolute; inset: 0; display: grid; place-items: center; font-size: 56px; }
  .shot .credit { position: absolute; bottom: 8px; right: 10px; font-size: 10px; color: #fff;
    background: rgba(35,25,15,.55); border-radius: 6px; padding: 2px 7px; }

  .sheet h2 { font-family: var(--display); font-weight: 700; font-size: 25px; line-height: 1.2; }
  .sheet .orig-sub { font-family: var(--serif); font-size: 17px; color: var(--dim); margin-top: 3px; }
  .sheet .sub { color: var(--dim); font-size: 14.5px; margin: 10px 0 16px; line-height: 1.55; }

  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .fact { border: 1.5px solid var(--edge); background: var(--card); border-radius: 14px; padding: 11px 13px; }
  .fact .k { font-size: 10px; text-transform: uppercase; letter-spacing: .11em; color: var(--dim); }
  .fact .v { font-size: 14.5px; margin-top: 4px; font-weight: 500; }
  .chili { display: inline-block; opacity: 0; transform: scale(0); animation: pop .25s cubic-bezier(.3,1.6,.5,1) forwards; }
  .chili:nth-child(1){animation-delay:.15s}.chili:nth-child(2){animation-delay:.27s}.chili:nth-child(3){animation-delay:.39s}
  @keyframes pop { to { opacity: 1; transform: scale(1); } }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 4px 0 14px; }
  .chip { font-size: 12.5px; font-weight: 600; color: var(--ink); background: var(--card);
    border: 1.5px solid var(--edge); border-radius: 999px; padding: 5px 12px; }
  .krow { font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); margin: 14px 0 7px; }

  .meta2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 6px; }
  .warnbar { font-size: 13px; color: #A5301D; background: #FBEAE6; border-radius: 12px; padding: 9px 13px; margin: 4px 0 12px; }

  .sheet p.body { font-size: 14px; line-height: 1.6; margin: 10px 0; }
  .sheet p.body b { color: var(--red); font-weight: 700; }

  .heritage { margin: 18px 0 6px; padding: 18px 20px; border-radius: 18px;
    background: var(--card); border: 1.5px solid var(--edge);
    border-left: 4px solid var(--red); box-shadow: 0 2px 10px rgba(35,25,15,.04); }
  .heritage .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .14em; color: var(--red); margin-bottom: 8px; font-weight: 800; }
  .heritage p { font-family: var(--serif); font-size: 15px; line-height: 1.75; }

  .origin { margin-top: 18px; }
  .origin .region { font-family: var(--display); font-weight: 700; font-size: 18px; margin-bottom: 10px; }
  .origin iframe { width: 100%; height: 190px; border: 1.5px solid var(--edge); border-radius: 16px; }
  .explore-btn { width: 100%; margin-top: 12px; }

  .region-panel { overflow: hidden; max-height: 0; opacity: 0; transition: max-height .6s ease, opacity .5s ease .1s; }
  .region-panel.open { max-height: 2000px; opacity: 1; }
  .region-panel .inner { padding-top: 16px; }
  .region-panel h3 { font-family: var(--display); font-size: 19px; font-weight: 700; margin-bottom: 6px; }
  .region-panel p { font-size: 14px; line-height: 1.65; color: var(--ink); margin-bottom: 12px; }

  /* ---- explore tab ---- */
  .explore-head { text-align: center; padding: 26px 10px 8px; }
  .explore-head h2 { font-family: var(--display); font-weight: 500; font-size: 27px; line-height: 1.25; }
  .explore-head h2 em { font-style: italic; color: var(--red); }
  .explore-head p { color: var(--dim); font-size: 14.5px; margin-top: 8px; }
  .cityrow { display: flex; gap: 8px; margin: 18px 0 8px; }
  .cityrow input { flex: 1; font: inherit; font-size: 16px; padding: 13px 16px;
    border: 1.5px solid var(--edge); border-radius: 14px; background: var(--card); color: var(--ink); }
  .cityrow input:focus { outline: none; border-color: var(--red); }
  .locbtn { font-size: 13px; color: var(--dim); background: none; border: none; padding: 8px; font-weight: 600; }
  .guide-card { border: 1.5px solid var(--edge); background: var(--card); border-radius: 18px;
    padding: 17px 19px; margin-bottom: 12px; box-shadow: 0 2px 10px rgba(35,25,15,.04);
    opacity: 0; transform: translateY(18px);
    transition: opacity .5s cubic-bezier(.2,.7,.3,1), transform .5s cubic-bezier(.2,.7,.3,1); }
  .guide-card.in { opacity: 1; transform: none; }
  .guide-card.tap { cursor: pointer; }
  .guide-card.tap:active { border-color: var(--red); }
  .guide-card .gk { font-size: 10.5px; text-transform: uppercase; letter-spacing: .13em; color: var(--red); font-weight: 800; margin-bottom: 7px; }
  .guide-card p { font-size: 14px; line-height: 1.65; }
  .gdish .en { font-family: var(--display); font-weight: 700; font-size: 18px; }
  .gdish .og { font-family: var(--serif); color: var(--dim); font-size: 14.5px; margin-top: 2px; }
  .gdish .why { font-size: 14px; margin-top: 8px; line-height: 1.5; }
  .gdish .meta { font-size: 13px; color: var(--dim); margin-top: 8px; line-height: 1.55; }
  .gdish .meta b { color: var(--gold); font-weight: 700; }

  /* sheet section stagger */
  .sec { opacity: 0; transform: translateY(12px); animation: secin .5s cubic-bezier(.2,.7,.3,1) forwards; animation-delay: calc(var(--d, 0) * 90ms); }
  @keyframes secin { to { opacity: 1; transform: none; } }

  /* photo fade-in + carousel dots */
  .shot img { opacity: 0; transition: opacity .5s ease; }
  .shot img.ld { opacity: 1; }
  .dots-row { display: flex; justify-content: center; gap: 6px; margin: -6px 0 14px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--edge); transition: all .25s ease; }
  .dot.on { background: var(--red); width: 18px; border-radius: 3px; }

  /* chips feel tappable */
  .chip.tapc { cursor: pointer; transition: transform .12s ease, border-color .12s ease; }
  .chip.tapc:active { transform: scale(.92); border-color: var(--red); }

  .mapslink { display: block; text-align: center; text-decoration: none; margin: 6px 0 2px; padding: 12px; }
  .morebtn { font: inherit; font-size: 13.5px; font-weight: 700; color: var(--red);
    background: none; border: none; padding: 8px 0 0; }

  /* mini ingredient overlay (sits above the sheet) */
  .ing-scrim { position: fixed; inset: 0; background: rgba(35,25,15,.5); z-index: 90;
    opacity: 0; pointer-events: none; transition: opacity .2s; }
  .ing-card { position: fixed; left: 50%; top: 50%; z-index: 95; width: min(88vw, 380px);
    background: var(--paper); border-radius: 20px; padding: 0 0 20px; overflow: hidden;
    transform: translate(-50%, -50%) scale(.9); opacity: 0; pointer-events: none;
    transition: transform .3s cubic-bezier(.3,1.4,.5,1), opacity .2s;
    box-shadow: 0 24px 60px rgba(35,25,15,.3); }
  .ing-open .ing-scrim { opacity: 1; pointer-events: auto; }
  .ing-open .ing-card { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
  .ing-card .ing-img { height: 150px; background: linear-gradient(135deg, #F0E6D4, #E7DBC5);
    display: grid; place-items: center; font-size: 44px; }
  .ing-card .ing-img img { width: 100%; height: 100%; object-fit: cover; }
  .ing-card .pad { padding: 16px 18px 0; }
  .ing-card h4 { font-family: var(--display); font-size: 19px; font-weight: 700; margin-bottom: 6px; }
  .ing-card p { font-size: 13.5px; line-height: 1.6; margin-bottom: 8px; }
  .ing-card .tl { color: var(--gold); font-weight: 600; }

  /* pinned menu photo */
  .menu-photo { position: relative; height: clamp(110px, 18vw, 150px); border-radius: 18px; overflow: hidden;
    margin-bottom: 16px; cursor: pointer; border: 1.5px solid var(--edge); }
  .menu-photo img { width: 100%; height: 100%; object-fit: cover; }
  .menu-photo .mp-label { position: absolute; inset: auto 0 0 0; padding: 22px 14px 9px;
    background: linear-gradient(transparent, rgba(35,25,15,.72)); color: #fff;
    font-size: 12.5px; font-weight: 700; letter-spacing: .04em; }
  .zoom-scrim { position: fixed; inset: 0; z-index: 120; background: rgba(20,14,8,.93);
    display: none; place-items: center; padding: 16px; }
  .zoom-scrim.on { display: grid; }
  .zoom-scrim img { max-width: 100%; max-height: 92dvh; border-radius: 12px; }

  /* card side thumbnail */
  .card { display: flex; gap: 14px; align-items: flex-start; }
  .card .cbody { flex: 1; min-width: 0; }
  .card .cthumb { flex: 0 0 66px; width: 66px; height: 66px; border-radius: 12px; overflow: hidden;
    background: linear-gradient(135deg, #F0E6D4, #E7DBC5); display: grid; place-items: center;
    font-size: 26px; margin-top: 26px; }
  .card .cthumb img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .4s; }
  .card .cthumb img.ld { opacity: 1; }

  /* city hero + map */
  .city-hero { opacity: 0; transform: translateY(18px);
    transition: opacity .5s cubic-bezier(.2,.7,.3,1), transform .5s cubic-bezier(.2,.7,.3,1); }
  .city-hero.in { opacity: 1; transform: none; }
  .city-hero { position: relative; height: clamp(170px, 26vw, 230px); border-radius: 20px; overflow: hidden;
    margin-bottom: 12px; background: linear-gradient(135deg, #E8DCC6, #D9C9AC); }
  .city-hero img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .6s; }
  .city-hero img.ld { opacity: 1; }
  .city-hero .ch-name { position: absolute; inset: auto 0 0 0; padding: 40px 18px 14px;
    background: linear-gradient(transparent, rgba(35,25,15,.72)); color: #fff;
    font-family: var(--display); font-weight: 700; font-size: 26px; }
  .city-map iframe { width: 100%; height: 150px; border: 1.5px solid var(--edge); border-radius: 16px; }

  /* guide dish rows with thumbs */
  .gdish { display: flex; gap: 14px; }
  .gdish .gbody { flex: 1; min-width: 0; }
  .gdish .cthumb { flex: 0 0 72px; width: 72px; height: 72px; border-radius: 14px; overflow: hidden;
    background: linear-gradient(135deg, #F0E6D4, #E7DBC5); display: grid; place-items: center; font-size: 28px; }
  .gdish .cthumb img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .4s; }
  .gdish .cthumb img.ld { opacity: 1; }
  .price-pill { display: inline-block; font-size: 12px; font-weight: 800; color: var(--green);
    border: 1.5px solid var(--green); border-radius: 999px; padding: 2px 10px; margin-top: 8px; }
  .spots { font-size: 13px; margin-top: 8px; line-height: 1.55; }
  .spots b { color: var(--red); font-weight: 700; }

  @media (prefers-reduced-motion: reduce) {
    .sec { animation: none; opacity: 1; transform: none; }
    .card, .guide-card { transition: none; opacity: 1; transform: none; }
    .chili { animation: none; opacity: 1; transform: none; }
    .sheet, .region-panel { transition: none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand"><div class="seal">食</div><h1>Dishcovery</h1></div>
  <select id="lang">
    <option>English</option><option>繁體中文</option><option>日本語</option>
  </select>
</header>

<nav>
  <button class="tab on" id="tabScan" onclick="switchTab('scan')">Scan a menu</button>
  <button class="tab" id="tabExplore" onclick="switchTab('explore')">Explore a city</button>
</nav>

<main>
  <!-- ============ SCAN VIEW ============ -->
  <div class="view on" id="viewScan">
    <div class="error" id="error"></div>
    <div class="capture" id="capture">
      <div class="dots">· · ·</div>
      <h2>Every menu, <em>decoded.</em></h2>
      <p>Point your camera at a menu in any language. Tap a dish to see what it really is.</p>
      <button class="btn" onclick="fileCam.click()">📷 Take a photo</button>
      <button class="btn ghost" onclick="fileLib.click()">Upload from library</button>
      <input type="file" id="fileCam" accept="image/*" capture="environment" style="display:none">
      <input type="file" id="fileLib" accept="image/*" style="display:none">
    </div>
    <div class="loading" id="loading">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      <div class="hint">Reading the menu…</div>
    </div>
    <div class="lang-tag" id="langTag">Menu language <span class="pill" id="langName"></span></div>
    <div id="cards"></div>
    <button class="btn ghost again" id="again" onclick="reset()">Scan another menu</button>
  </div>

  <!-- ============ EXPLORE VIEW ============ -->
  <div class="view" id="viewExplore">
    <div class="error" id="errorX"></div>
    <div class="explore-head">
      <h2>Where are you <em>eating?</em></h2>
      <p>Enter a city to see its must-try dishes, local customs, and how to eat like a local.</p>
    </div>
    <div class="cityrow">
      <input id="cityInput" placeholder="e.g. Tainan, Osaka, Bangkok…" enterkeyhint="search">
      <button class="btn" style="padding:13px 20px" onclick="loadCity()">Go</button>
    </div>
    <div style="text-align:center"><button class="locbtn" onclick="useLocation()">📍 Use my location</button></div>
    <div class="loading" id="loadingX">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      <div class="hint">Asking the locals…</div>
    </div>
    <div id="guide"></div>
  </div>
</main>

<div id="overlay">
  <div class="scrim" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet"></div>
</div>

<div class="zoom-scrim" id="zoom" onclick="closeZoom()">
  <img id="zoomImg" src="" alt="menu">
</div>

<div class="ing-scrim" onclick="closeIngredient()"></div>
<div class="ing-card" id="ingBody"></div>

<script>
const $ = id => document.getElementById(id);
let menuLang = "unknown";
const EMOJI = { main:"🍜", side:"🥟", soup:"🍲", cold_dish:"🥗", dessert:"🍡", drink:"🍵", other:"🥢" };
function mapLang() {
  const v = $("lang").value;
  return v === "繁體中文" ? "zh-TW" : v === "日本語" ? "ja" : "en";
}

let lastPhotoURL = null;
function openZoom() { if (!lastPhotoURL) return; $("zoomImg").src = lastPhotoURL; $("zoom").classList.add("on"); }
function closeZoom() { $("zoom").classList.remove("on"); }

/* scroll-reveal: cards animate in as they enter the viewport */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
}), { threshold: 0.08 });
function reveal(el, i) { el.style.transitionDelay = `${Math.min(i * 60, 360)}ms`; io.observe(el); }

function switchTab(t) {
  $("tabScan").classList.toggle("on", t === "scan");
  $("tabExplore").classList.toggle("on", t === "explore");
  $("viewScan").classList.toggle("on", t === "scan");
  $("viewExplore").classList.toggle("on", t === "explore");
}

/* ============ SCAN ============ */
async function handleFile(e) {
  const f = e.target.files[0];
  if (!f) return;
  if (lastPhotoURL) URL.revokeObjectURL(lastPhotoURL);
  lastPhotoURL = URL.createObjectURL(f);
  show("loading"); hideError();
  const form = new FormData();
  form.append("image", f);
  form.append("target_lang", $("lang").value);
  try {
    const r = await fetch("/api/menu", { method: "POST", body: form });
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    render(await r.json());
  } catch (err) { showError("Couldn't read that menu: " + err.message); show("capture"); }
  e.target.value = "";
}

function render(data) {

/* batched, AI-verified card thumbnails: cards already show emoji;
   this fills in a real photo only where verification passes, else keeps emoji. */
async function loadCardThumbs(dishes) {
  try {
    const payload = dishes.map(d => ({
      name: d.translated_name,
      query: d.image_query || d.translated_name.split("(")[0].trim(),
    }));
    const r = await fetch("/api/card_thumbs", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ dishes: payload }),
    });
    if (!r.ok) return;
    const j = await r.json();
    j.thumbs.forEach((url, i) => {
      if (!url) return; // no verified photo -> keep the emoji
      const cell = $("th" + i);
      if (cell) cell.innerHTML = `<img src="${url}" alt="" onload="this.classList.add('ld')">`;
    });
  } catch (_) {}
}

/* ============ DETAIL SHEET ============ */
async function openSheet(dish) {
  $("sheet").innerHTML = `<div class="grabber"></div>
    <h2>${esc(dish.translated_name || dish.original)}</h2>
    <div class="orig-sub">${esc(dish.original)}</div>
    <div class="sub">${esc(dish.what_it_is)}</div>
    <div class="skeleton" style="height:180px"></div>`;
  document.body.classList.add("open");
  // fire the image pipeline NOW, in parallel with the dish-detail call,
  // using tier-1's image_query so we don't wait for tier-2
  const photosP = fetch("/api/dish_images", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      dish_name: dish.translated_name || dish.original,
      canonical: dish.image_query || "",
      max_images: 6,
    }),
  }).then(r => r.ok ? r.json() : { images: [], label: "" }).catch(() => ({ images: [], label: "" }));
  try {
    const r = await fetch("/api/dish", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: dish.original, language: menuLang, target_lang: $("lang").value }),
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    renderDetail(dish, await r.json(), photosP);
  } catch (err) {
    $("sheet").innerHTML = `<div class="grabber"></div><h2>${esc(dish.original)}</h2>
      <p class="body" style="color:#A5301D;margin-top:10px">Couldn't load details: ${esc(err.message)}</p>`;
  }
}

/* render candidates the moment they arrive; verify in background and prune fails */
async function fillCarousel(photosP, dishName, imageQuery) {
  try {
    const j = await photosP;
    if (!j.images || !j.images.length) return; // emoji fallback
    const car = $("carousel");
    if (!car) return;
    const drawDots = n => {
      $("dots").innerHTML = Array.from({length: n}, (_, i) => `<span class="dot ${i===0?"on":""}"></span>`).join("");
    };
    car.innerHTML = j.images.map(u =>
      `<div class="shot" data-u="${u}"><img src="${u}" alt="${esc(j.label)}" loading="lazy" onload="this.classList.add('ld')">
        <span class="credit">${esc(j.label)}</span></div>`).join("");
    drawDots(j.images.length);
    car.onscroll = () => {
      const kids = [...$("dots").children];
      const i = Math.round(car.scrollLeft / (car.firstElementChild.offsetWidth + 10));
      kids.forEach((d, k) => d.classList.toggle("on", k === i));
    };
    if (j.verified) return; // cache hit: already the verified set
    // background verification: silently drop images the AI rejects
    const vr = await fetch("/api/dish_images", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ dish_name: dishName, canonical: imageQuery || "", verify_urls: j.images }),
    });
    if (!vr.ok) return;
    const v = await vr.json();
    let removed = 0;
    v.results.forEach((ok, i) => {
      if (!ok) {
        const el = car.querySelector(`[data-u="${CSS.escape(j.images[i])}"]`);
        if (el) { el.remove(); removed++; }
      }
    });
    if (removed) {
      const left = car.querySelectorAll(".shot").length;
      if (!left) car.innerHTML = `<div class="shot"><span class="fallback">🥢</span></div>`;
      drawDots(Math.max(left, 1));
    }
  } catch (_) {}
}

/* heritage deep-dive */
async function loadStory(name, canonical) {
  const btn = $("moreBtn");
  btn.disabled = true; btn.textContent = "Loading…";
  try {
    const r = await fetch("/api/story", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, canonical, target_lang: $("lang").value }),
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    const j = await r.json();
    $("storyText").innerHTML = j.story.split("\n\n").map(p => esc(p)).join("<br><br>");
    btn.remove();
  } catch (err) { btn.disabled = false; btn.textContent = "Tell me more →"; }
}

/* ingredient mini-card */
function wireIngredientChips(root) {
  root.querySelectorAll(".chip.tapc[data-ing]").forEach(ch => {
    ch.onclick = ev => { ev.stopPropagation(); openIngredient(ch.dataset.ing); };
  });

async function openIngredient(name) {
  $("ingBody").innerHTML = `<div class="ing-img">🌿</div>
    <div class="pad"><h4>${esc(name)}</h4><p style="color:var(--dim)">Loading…</p></div>`;
  document.body.classList.add("ing-open");
  // image + text in parallel
  const imgP = (async () => {
    try {
      const w = await fetch(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrsearch=${encodeURIComponent(name)}&gsrlimit=4&prop=imageinfo&iiprop=url&iiurlwidth=600&format=json&origin=*`);
      const j = await w.json();
      const hit = Object.values(j.query?.pages || {}).sort((a,b)=>a.index-b.index)
        .find(p => /\.(jpe?g|png)$/i.test(p.title) && p.imageinfo?.[0]?.thumburl);
      return hit ? hit.imageinfo[0].thumburl : null;
    } catch (_) { return null; }
  })();
  const infoP = (async () => {
    const r = await fetch("/api/ingredient", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, target_lang: $("lang").value }),
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    return r.json();
  })();
  try {
    const [img, info] = await Promise.all([imgP, infoP]);
    $("ingBody").innerHTML = `
      <div class="ing-img">${img ? `<img src="${img}" alt="${esc(name)}">` : "🌿"}</div>
      <div class="pad">
        <h4>${esc(info.name)}</h4>
        <p>${esc(info.overview)}</p>
        <p class="tl">Tastes like · ${esc(info.tastes_like)}</p>
        <p style="color:var(--dim)">Used in · ${esc(info.used_in.join(", "))}</p>
      </div>`;
  } catch (err) {
    $("ingBody").innerHTML = `<div class="pad" style="padding-top:18px"><h4>${esc(name)}</h4>
      <p style="color:#A5301D">Couldn't load: ${esc(err.message)}</p></div>`;
  }
}
function closeIngredient() { document.body.classList.remove("ing-open"); }

function titleCase(x) { return x.replace(/\S+/g, w => w[0].toUpperCase() + w.slice(1)); }
async function loadCity() {
  const city = titleCase($("cityInput").value.trim());
  if (!city) return;
  $("cityInput").value = city;
  $("guide").innerHTML = ""; hideErrorX();

  cards.push(`<div class="guide-card"><div class="gk">Eat like a local</div><p>${esc(g.customs)}</p></div>`);
  g.dishes.forEach(d => {
    const spots = d.famous_spots && d.famous_spots.length
      ? `<div class="spots"><b>Famous for it</b> · ${d.famous_spots.map(sp =>

    cards.push(`<div class="guide-card tap gdish" data-og="${esc(d.name_original)}" data-en="${esc(d.name_english)}" data-why="${esc(d.why)}" data-city="${esc(g.city)}">
      <div class="gbody">

        <div class="og">${esc(d.name_original)}</div>

        ${spots}
      </div>
      <div class="cthumb">🍽</div>
    </div>`);
  });
  $("guide").innerHTML = cards.join("");
  document.querySelectorAll("#guide .guide-card, #guide .city-hero").forEach((el, i) => {
    reveal(el, i);

  $("guide").appendChild(note);
}

/* city hero photo from Wikipedia (city articles almost always have one) */
async function loadCityHero(city) {
  try {
    // REST summary = editor-chosen lead image, much better than random search thumbnail
    const r = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(city)}`);
    if (r.ok) {
      const j = await r.json();
      const src = (j.originalimage?.source || j.thumbnail?.source || "")
        .replace(/\/\d+px-/, "/1200px-");
      if (src && $("cityHero")) {
        $("cityHero").insertAdjacentHTML("afterbegin",
          `<img src="${src}" alt="${esc(city)}" onload="this.classList.add('ld')">`);
        return;
      }
    }
    // fallback: search but only pick articles described as city/municipality/capital
    const r2 = await fetch(`https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(city + " city")}&gsrlimit=5&prop=pageimages|description&piprop=original&format=json&origin=*`);
    const j2 = await r2.json();
    const hit = Object.values(j2.query?.pages || {})
      .sort((a,b) => a.index - b.index)
      .find(p => p.original?.source && /(city|municipality|capital|district)/i.test(p.description || ""));
    if (hit && $("cityHero")) {
      $("cityHero").insertAdjacentHTML("afterbegin",
        `<img src="${hit.original.source}" alt="${esc(city)}" onload="this.classList.add('ld')">`);
    }
  } catch (_) {}
}

/* geolocation -> city name via OpenStreetMap Nominatim (needs https or localhost) */
function useLocation() {
  if (!navigator.geolocation) { showErrorX("Location isn't available in this browser."); return; }
  navigator.geolocation.getCurrentPosition(async pos => {
    try {
      const { latitude, longitude } = pos.coords;
      const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=en`);
      const j = await r.json();
      const city = j.city || j.locality || j.principalSubdivision;
      if (city) { $("cityInput").value = city; loadCity(); }
      else showErrorX("Couldn't work out your city — type it instead.");
    } catch (_) { showErrorX("Couldn't look up your location — type your city instead."); }
  }, () => showErrorX("Location permission denied — type your city instead. (Tip: location needs an https link, e.g. via ngrok.)"));
}

function showError(m){ const e=$("error"); e.textContent=m; e.classList.add("on"); }
function hideError(){ $("error").classList.remove("on"); }
function showErrorX(m){ const e=$("errorX"); e.textContent=m; e.classList.add("on"); }
function hideErrorX(){ $("errorX").classList.remove("on"); }
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
